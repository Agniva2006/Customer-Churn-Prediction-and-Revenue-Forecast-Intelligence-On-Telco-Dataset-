name: Telecom Churn Platform CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  lint:
    name: Code Quality Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Install flake8
        run: pip install flake8

      - name: Run Linting
        run: flake8 src/ api.py train.py --count --max-line-length=120 --statistics --ignore=E501,W503,E203

  test-and-verify:
    name: Build, Train & Test Pipeline
    runs-on: ubuntu-latest
    needs: lint

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Train Stacking Ensemble Model
        run: |
          python train.py

      - name: Verify Model Metadata Generated
        run: |
          test -f models/model_metadata.json && echo "✅ Model metadata found" || (echo "❌ Model metadata missing" && exit 1)

      - name: Run Pytest Suite
        run: |
          pytest tests/ -v --tb=short

  docker-verify:
    name: Docker Build Verification
    runs-on: ubuntu-latest
    needs: test-and-verify

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Build Docker Image
        run: docker build -t telco-churn-api:ci .
