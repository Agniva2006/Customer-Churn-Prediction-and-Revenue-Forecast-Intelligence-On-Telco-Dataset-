services:
  # FastAPI Prediction REST Engine
  - type: web
    name: telco-churn-api
    env: python
    buildCommand: pip install -r requirements.txt && python train.py
    startCommand: gunicorn api:app --workers 4 --worker-class uvicorn.workers.UvicornWorker --bind 0.0.0.0:$PORT
    healthCheckPath: /health
    plan: free
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.12

  # Standalone Streamlit Intelligence Dashboard
  - type: web
    name: telco-churn-dashboard
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: streamlit run streamlit_app.py --server.port $PORT --server.address 0.0.0.0
    plan: free
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.12
      - key: API_URL
        fromService:
          type: web
          name: telco-churn-api
          property: host
