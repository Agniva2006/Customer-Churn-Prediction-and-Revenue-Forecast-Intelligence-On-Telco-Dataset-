services:
  # FastAPI Prediction REST Engine
  - type: web
    name: telco-churn-api
    env: python
    buildCommand: pip install -r requirements.txt && python train.py
    startCommand: uvicorn api:app --host 0.0.0.0 --port $PORT
    plan: free
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.12

  # Standalone Streamlit Intelligence Dashboard
  - type: web
    name: telco-churn-dashboard
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: streamlit run streamlit_app.py --server.port $PORT --server.address 0.0.0.0
    plan: free
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.12
